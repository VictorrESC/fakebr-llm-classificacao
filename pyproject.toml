[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fakebr-experiments"
version = "0.2.0"
description = "Experimentos reproduzíveis de classificação Fake.Br com DeepInfra"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hydra-core>=1.3,<2",
  "openai>=1.60,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.7,<4",
  "pyyaml>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
fakebr-experiments = { path = ".", editable = true }
# Apenas para notebooks/ (não são dependências do pacote).
jupyterlab = ">=4.2,<5"
ipykernel = ">=6.29,<8"
pandas = ">=2.2,<3"

[tool.pixi.tasks]
status = "python -m fakebr.cli status"
experiment = "python -m fakebr.cli experiment"
report = "python -m fakebr.cli report"
costs = "python -m fakebr.cli costs"
cache-import = "python -m fakebr.cli cache-import"
fetch-data = "python -m fakebr.cli fetch-data"
notebook = "jupyter lab notebooks/resultados.ipynb"
test = "python -m unittest discover -s tests -p 'test_*.py' -q"
