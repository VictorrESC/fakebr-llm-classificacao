# @package _global_
# Fake.Br com os textos completos (full_texts), como circularam: experimento
# exploratório de comportamento dos modelos no corpus. T=0 com 3 repetições
# (o DeepSeek não é determinístico em T=0). Com a mesma seed, o sorteio de 500
# pares no eval estende o do piloto: os 10 pares do dev e os 200 primeiros do
# eval são os mesmos, o que permite comparar notícia a notícia com os runs
# anteriores no subconjunto comum.
#
# Atenção ao interpretar: em full_texts o comprimento separa as classes
# (veja report_<etapa>/length_baseline.csv).
experiment:
  runner: multimodel
  description: Fake.Br textos completos, prompt A, T=0 com 3 repetições
  dataset:
    name: fakebr
    texts: full_texts
  seed: 20260923
  dev_pairs: 10
  eval_pairs: 500
  pairs_from: null
  prompt_set: veracidade_v1  # conf/prompts/veracidade_v1.yaml
  prompts: [A]
  models:
    - deepseek_v41_flash
    - qwen38_27b
    - gemma4_31b
  conditions:
    - temperature: 0.0
      repetitions: 3
  top_p: 1.0
  max_tokens: 16
  bootstrap_repeats: 500
